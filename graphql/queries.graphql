query Rules {
  rules {
    count
    rules {
      ... RuleInfo
      children {
        ... RuleInfo
      }
      parent {
        ... RuleInfo
      }
    }
  }
}

query Rule($id: Int!) {
  rule(id: $id) {
    ... RuleInfo
    children {
      ... RuleInfo
    }
    parent {
      ... RuleInfo
    }
  }
}

query RulesByQuery($query: String!) {
  rulesByQuery(query: $query) {
    count
    rules {
      ... RuleInfo
      children {
        ... RuleInfo
      }
      parent {
        ... RuleInfo
      }
    }
  }
}

query Search($query: String!) {
  search(query: $query) {
    count
    cards {
      ...CardBasicInfo
    }
  }
}

query Set($input: SetByIDInput!) {
  set(input: $input) {
    ...SetInfo
    cards {
      ...CardBasicInfo
    }
  }
}

query Sets {
  sets {
    count
    sets {
      ...SetInfo
    }
  }
}

query SetsByName {
  setsByName {
    ...SectionedSets
  }
}

query SetsByType {
  setsByType {
    ...SectionedSets
  }
}

query SetsByYear {
  setsByYear {
    ...SectionedSets
  }
}

query Card($id: String!) {
  card(id: $id) {
    ...CardCompleteInfo
  }
}

query CardPrintings($id: String!, $languageID: String!) {
  cardPrintings(id: $id, languageID: $languageID) {
    count
    cards {
      ...CardBasicInfo
    }
  }
}

query CardsByIDs($ids: [String!]!) {
  cardsByIDs(ids: $ids) {
    count
    cards {
      ...CardBasicInfo
    }
  }
}

query Feeds {
  feeds {
    count
    feeds {
      title
      url
    }
  }
}
